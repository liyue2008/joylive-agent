apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: joylive-demo-kubernetes-gateway
    x-live-enabled: "true"
  name: joylive-demo-kubernetes-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joylive-demo-kubernetes-gateway
  template:
    metadata:
      labels:
        app: joylive-demo-kubernetes-gateway
        x-live-enabled: "true"
    spec:
      containers:
        - env:
            - name: SERVER_PORT
              value: "80"
            - name: CONFIG_SERVICE_API_TYPE
              value: istio
            - name: CONFIG_ISTIO_ADDRESS
              value: istiod.istio-system.svc.cluster.local:15010
            - name: LIVE_LOG_LEVEL
              value: INFO
            - name: APPLICATION_NAME
              value: kubernetes-gateway
            - name: APPLICATION_LOCATION_LIVESPACE_ID
              value: v4bEh4kd6Jvu5QBX09qYq-qlbcs
            - name: APPLICATION_LOCATION_UNIT
              value: unit1
            - name: APPLICATION_LOCATION_CELL
              value: cell1
          image: joylive-demo-kubernetes-gateway:1.6.4
          name: joylive-demo-kubernetes-gateway
          command: ["sleep", "infinity"]
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: { }
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: joylive-demo-kubernetes-gateway
spec:
  type: NodePort
  ports:
    - port: 80
      protocol: TCP
      targetPort: http
  selector:
    app: joylive-demo-kubernetes-gateway
